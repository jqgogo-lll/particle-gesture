<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>3D 粒子手势交互</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: system-ui, -apple-system, sans-serif; }
    #status { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.85); font-size: 14px; z-index: 10; pointer-events: none; text-align: center; transition: opacity 0.5s; }
    #gesture-label { position: fixed; top: 50px; left: 50%; transform: translateX(-50%); color: #6cf; font-size: 22px; font-weight: bold; z-index: 10; text-shadow: 0 0 20px rgba(100,200,255,0.8); opacity: 0; transition: opacity 0.3s; pointer-events: none; white-space: nowrap; }
    #start-btn { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); padding: 16px 40px; font-size: 18px; border: 2px solid rgba(100,200,255,0.6); border-radius: 30px; background: rgba(0,0,0,0.7); color: #aaccff; cursor: pointer; z-index: 100; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); transition: all 0.3s; letter-spacing: 2px; }
    #start-btn:hover { background: rgba(30,60,120,0.8); border-color: rgba(150,220,255,0.9); box-shadow: 0 0 30px rgba(100,180,255,0.4); }
    #start-btn:active { transform: translate(-50%, -50%) scale(0.95); }
    #start-btn.hidden { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="status">加载中...</div>
  <div id="gesture-label"></div>
  <button id="start-btn">✨ 点击启动</button>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.170.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.170.0/examples/jsm/"
      }
    }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

    // ── UI Elements ──────────────────────────────
    const statusEl = document.getElementById('status');
    const gestureEl = document.getElementById('gesture-label');
    const startBtn = document.getElementById('start-btn');

    function setStatus(text, color) {
      statusEl.textContent = text;
      if (color) statusEl.style.color = color;
      statusEl.style.opacity = '1';
    }

    // ── Renderer ─────────────────────────────────
    setStatus('✅ 初始化渲染器...', '#0f0');

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setClearColor(0x000000);
    document.body.prepend(renderer.domElement);
    Object.assign(renderer.domElement.style, {
      position: 'fixed', top: '0', left: '0', width: '100%', height: '100%', zIndex: '0',
    });

    // ── Scene & Camera ───────────────────────────
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 80);
    camera.position.set(0, 0, 12);
    camera.lookAt(0, 0, 0);

    // ── Post Processing ──────────────────────────
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloomPass = new UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight), 1.2, 0.4, 0.15
    );
    composer.addPass(bloomPass);

    setStatus('✅ 场景就绪 — 生成粒子...', '#0f0');

    // ── Particle Sphere ──────────────────────────
    const COUNT = 6000;
    const COMPACT_R = 0.4;
    const SCATTER_R = 10;

    const baseDir = new Float32Array(COUNT * 3);
    const baseR = new Float32Array(COUNT);
    const posArr = new Float32Array(COUNT * 3);
    const velArr = new Float32Array(COUNT * 3);
    const colArr = new Float32Array(COUNT * 3);
    const sizeArr = new Float32Array(COUNT);

    const cosmicPalette = [
      new THREE.Color('#FF6B35'), new THREE.Color('#FFD700'),
      new THREE.Color('#FF2D95'), new THREE.Color('#F72585'),
      new THREE.Color('#C73A8A'), new THREE.Color('#9B30FF'),
      new THREE.Color('#6A0CFF'), new THREE.Color('#7B68EE'),
      new THREE.Color('#00BFFF'), new THREE.Color('#00DDDD'),
      new THREE.Color('#00FFAA'), new THREE.Color('#69F0AE'),
    ];

    function cosmicColor(r, phi) {
      const t = r;
      const hueShift = phi / (Math.PI * 2);
      let idx;
      if (t < 0.25) idx = (hueShift * 3) | 0;
      else if (t < 0.5) idx = 3 + ((hueShift * 4) | 0);
      else if (t < 0.75) idx = 6 + ((hueShift * 3) | 0);
      else idx = 9 + ((hueShift * 3) | 0);
      idx = Math.min(idx, cosmicPalette.length - 1);
      const c = cosmicPalette[idx].clone();
      c.r += (Math.random() - 0.5) * 0.2;
      c.g += (Math.random() - 0.5) * 0.2;
      c.b += (Math.random() - 0.5) * 0.2;
      return c;
    }

    for (let i = 0; i < COUNT; i++) {
      const u = Math.random() * 2 - 1;
      const theta = Math.random() * Math.PI * 2;
      const r = Math.cbrt(Math.random());
      const s = Math.sqrt(1 - u * u);
      const dx = s * Math.cos(theta);
      const dy = s * Math.sin(theta);
      const dz = u;
      baseDir[i * 3] = dx;
      baseDir[i * 3 + 1] = dy;
      baseDir[i * 3 + 2] = dz;
      baseR[i] = r * SCATTER_R;
      posArr[i * 3] = dx * r * SCATTER_R;
      posArr[i * 3 + 1] = dy * r * SCATTER_R;
      posArr[i * 3 + 2] = dz * r * SCATTER_R;
      const phi = Math.atan2(dy, dx) + Math.PI;
      const c = cosmicColor(r, phi);
      colArr[i * 3] = c.r;
      colArr[i * 3 + 1] = c.g;
      colArr[i * 3 + 2] = c.b;
      sizeArr[i] = 0.04 + Math.random() * 0.10;
    }

    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(posArr, 3));
    geo.setAttribute('color', new THREE.BufferAttribute(colArr, 3));
    geo.setAttribute('size', new THREE.BufferAttribute(sizeArr, 1));

    const mat = new THREE.ShaderMaterial({
      uniforms: {},
      vertexShader: /*glsl*/`
        attribute float size;
        attribute vec3 color;
        varying vec3 vColor;
        void main() {
          vColor = color;
          vec4 mv = modelViewMatrix * vec4(position, 1.0);
          gl_PointSize = size * (600.0 / -mv.z);
          gl_Position = projectionMatrix * mv;
        }
      `,
      fragmentShader: /*glsl*/`
        varying vec3 vColor;
        void main() {
          float d = length(gl_PointCoord - 0.5) * 2.0;
          float a = exp(-d * d * 1.8);
          vec3 c = vColor * (1.5 + exp(-d * d * 3.0));
          gl_FragColor = vec4(c, a * 0.9);
        }
      `,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
      depthTest: true,
      transparent: true,
    });

    const points = new THREE.Points(geo, mat);
    scene.add(points);

    setStatus('🖐 点击启动手势追踪', 'rgba(120,200,255,0.9)');

    // ── State ────────────────────────────────────
    const hand = { active: false, gesture: 'open', roll: 0, prevRoll: 0, rollDelta: 0, extended: 5, prevExtended: 5 };
    const mouse = { active: false, gesture: 'open' };
    let curR = SCATTER_R;
    let curAngle = 0;

    // Mouse / Touch events — always work, no network needed
    document.addEventListener('mousemove', () => { mouse.active = true; });
    document.addEventListener('mouseleave', () => { mouse.active = false; });
    document.addEventListener('mousedown', () => { mouse.gesture = 'fist'; });
    document.addEventListener('mouseup', () => { mouse.gesture = 'open'; });
    document.addEventListener('touchstart', () => { mouse.active = true; }, { passive: true });
    document.addEventListener('touchend', () => { mouse.active = false; });
    document.addEventListener('touchmove', () => { mouse.active = true; }, { passive: true });

    // ── Hand Tracking ────────────────────────────
    let handLandmarker = null;
    let lastVideoTime = -1;
    const videoEl = document.createElement('video');
    videoEl.setAttribute('playsinline', '');
    videoEl.setAttribute('autoplay', '');

    function countFingers(lm) {
      let n = 0;
      const tips = [4, 8, 12, 16, 20];
      const dips = [3, 6, 10, 14, 18];
      for (let i = 0; i < 5; i++) {
        if (i === 0) { if (Math.abs(lm[tips[i]].x - lm[5].x) > 0.07) n++; }
        else { if (lm[tips[i]].y < lm[dips[i]].y) n++; }
      }
      return n;
    }

    function shortAngle(a, b) {
      let d = a - b;
      while (d > Math.PI) d -= Math.PI * 2;
      while (d < -Math.PI) d += Math.PI * 2;
      return d;
    }

    function detectHands() {
      if (!handLandmarker || videoEl.readyState < 2) return;
      const now = performance.now();
      if (videoEl.currentTime === lastVideoTime) return;
      lastVideoTime = videoEl.currentTime;
      const r = handLandmarker.detectForVideo(videoEl, now);
      if (!r.landmarks?.length) { hand.active = false; return; }
      const lm = r.landmarks[0];
      const rawRoll = Math.atan2(lm[17].y - lm[5].y, lm[17].x - lm[5].x);
      if (hand.active) {
        hand.rollDelta = shortAngle(rawRoll, hand.prevRoll);
        hand.roll += hand.rollDelta * 3;
      } else {
        hand.roll = rawRoll;
        hand.rollDelta = 0;
      }
      hand.prevRoll = rawRoll;
      hand.prevExtended = hand.extended;
      hand.extended = countFingers(lm);
      hand.gesture = hand.extended <= 1 ? 'fist' : hand.extended === 2 ? 'pinch' : 'open';
      hand.active = true;
    }

    async function initHands() {
      // Step 1: Camera
      setStatus('📷 请求摄像头权限...', 'rgba(120,200,255,0.9)');
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { width: 640, height: 480, facingMode: 'user' },
        audio: false,
      });
      videoEl.srcObject = stream;
      await videoEl.play();

      // Step 2: Load MediaPipe WASM
      setStatus('⬇️ 加载 AI 模型...', 'rgba(120,200,255,0.9)');

      const { HandLandmarker, FilesetResolver } = await import(
        'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/vision_bundle.mjs'
      );

      const vision = await FilesetResolver.forVisionTasks(
        'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.18/wasm'
      );

      setStatus('⬇️ 下载手势识别模型...', 'rgba(120,200,255,0.9)');

      handLandmarker = await HandLandmarker.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
        },
        runningMode: 'VIDEO',
        numHands: 1,
        minHandDetectionConfidence: 0.5,
        minTrackingConfidence: 0.5,
      });

      setStatus('🖐 张开=散开旋转 | ✊ 握拳=聚拢', 'rgba(120,200,255,0.9)');
      setTimeout(() => { statusEl.style.opacity = '0'; }, 3000);
    }

    // ── Animation ────────────────────────────────
    const labels = { open: '🖐 散开', fist: '✊ 聚拢', pinch: '🤏' };
    let lastG = '';

    function animate(ts) {
      requestAnimationFrame(animate);
      const t = ts * 0.001;
      const src = hand.active ? hand : mouse;
      const g = src.gesture;
      const ha = hand.active;

      const fd = ha ? Math.abs(hand.extended - hand.prevExtended) : 0;
      const rd = ha ? Math.abs(hand.rollDelta) : 0;
      const expandSpd = Math.min(0.015 + fd * 0.06, 0.2);
      const rotSpd = Math.min(0.06 + (fd + rd * 2) * 0.12, 0.3);

      const tr = g === 'fist' ? COMPACT_R : g === 'pinch' ? 1.8 : SCATTER_R;
      curR += (tr - curR) * expandSpd;

      const ta = (ha && g === 'open') ? hand.roll : curAngle;
      curAngle += (ta - curAngle) * rotSpd;

      if (ha && g !== lastG) {
        lastG = g;
        gestureEl.textContent = labels[g] || '';
        gestureEl.style.opacity = '1';
        clearTimeout(gestureEl._to);
        gestureEl._to = setTimeout(() => { gestureEl.style.opacity = '0'; }, 1500);
      }

      const cr = curR;
      const cosA = Math.cos(curAngle);
      const sinA = Math.sin(curAngle);
      const stiffness = 20;
      const damping = 9;

      for (let i = 0; i < COUNT; i++) {
        const i3 = i * 3;
        const bx = baseDir[i3];
        const by = baseDir[i3 + 1];
        const bz = baseDir[i3 + 2];
        const br = baseR[i];
        const tr2 = br * (cr / SCATTER_R);
        let tx = bx * tr2;
        let ty = by * tr2;
        let tz = bz * tr2;
        const rx = tx * cosA - ty * sinA;
        const ry = tx * sinA + ty * cosA;
        velArr[i3] += ((rx - posArr[i3]) * stiffness - velArr[i3] * damping) * 0.016;
        velArr[i3 + 1] += ((ry - posArr[i3 + 1]) * stiffness - velArr[i3 + 1] * damping) * 0.016;
        velArr[i3 + 2] += ((tz - posArr[i3 + 2]) * stiffness - velArr[i3 + 2] * damping) * 0.016;
        posArr[i3] += velArr[i3] * 0.016;
        posArr[i3 + 1] += velArr[i3 + 1] * 0.016;
        posArr[i3 + 2] += velArr[i3 + 2] * 0.016;
        posArr[i3] += Math.sin(t * 3 + i * 0.01) * 0.002;
        posArr[i3 + 1] += Math.cos(t * 3 + i * 0.01) * 0.002;
        posArr[i3 + 2] += Math.sin(t * 2.7 + i * 0.013) * 0.002;
        sizeArr[i] = 0.02 + 0.12 * (cr / SCATTER_R) + Math.random() * 0.01;
      }

      geo.attributes.position.needsUpdate = true;
      geo.attributes.size.needsUpdate = true;
      camera.lookAt(0, 0, 0);
      composer.render();
    }

    // ── Start ────────────────────────────────────
    let started = false;

    function trackLoop() {
      detectHands();
      requestAnimationFrame(trackLoop);
    }

    async function onStart() {
      if (started) return;
      started = true;
      startBtn.classList.add('hidden');

      try {
        await initHands();
        trackLoop();
        setTimeout(() => startBtn.remove(), 500);
      } catch (err) {
        console.error('Camera init error:', err);
        const msg = err.message || err.toString();
        if (msg.includes('NotAllowed') || msg.includes(' Permission')) {
          setStatus('📷 摄像头权限被拒绝 — 鼠标模式（按住鼠标=聚拢）', 'rgba(255,200,100,0.9)');
        } else if (msg.includes('NotReadable') || msg.includes('occupied')) {
          setStatus('📷 摄像头被占用 — 鼠标模式（按住鼠标=聚拢）', 'rgba(255,200,100,0.9)');
        } else {
          setStatus('🌐 网络加载失败 — 鼠标模式（按住鼠标=聚拢）', 'rgba(255,200,100,0.9)');
        }
        setTimeout(() => { statusEl.style.opacity = '0'; }, 4000);
        setTimeout(() => startBtn.remove(), 500);
      }
    }

    startBtn.addEventListener('click', onStart);
    startBtn.addEventListener('touchend', (e) => { e.preventDefault(); onStart(); });

    // Kick off animation immediately — particles visible without camera
    requestAnimationFrame(animate);

    // ── Resize ───────────────────────────────────
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
      camera.position.set(0, 0, 12);
      camera.lookAt(0, 0, 0);
    });
  </script>
</body>
</html>
